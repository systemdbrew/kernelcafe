apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: longhorn-storage
  namespace: longhorn-system
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "longhorn-storage",
      "type": "macvlan",
      "master": "enp1s0f0",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "10.10.50.0/24",
        "range_start": "10.10.50.220",
        "range_end": "10.10.50.239"
      }
    }
